    ocean.update(0, U.uTime.value, camera);             // apply the state (choppiness) to the FFT
    const target = 3.84e-4 * Math.pow(U10, 3.41) / 100;
    let lo = 0.6, hi = 0.98, cov = 0;
    for (let it = 0; it < 8; it++) {
      const b = 0.5 * (lo + hi);
      ocean.fft.whitecap = { bias: [b + offset, b], gain: ocean.fft.whitecap.gain > 0 && ocean.fft.whitecap.bias[1] > 0 ? ocean.fft.whitecap.gain : 40 };
      const cc = renderer.getClearColor(new THREE.Color()), ca = renderer.getClearAlpha();
      renderer.setClearColor(0x000000, 0);                 // alpha is the stage-B foam: start from none
      for (const rt of ocean.fft.sf) for (let c = 0; c < ocean.fft.count; c++) { renderer.setRenderTarget(rt, c); renderer.clear(); }
      renderer.setClearColor(cc, ca);
      renderer.setRenderTarget(null);
      for (let i = 0; i < 1500; i++) { U.uTime.value += 1 / 60; ocean.fft.update(U.uTime.value, 1 / 60); }   // 25 s: stage B (6 s) settles
      cov = coverage();
      if (cov > target) hi = b; else lo = b;
    }
    out.push({ U10, bias: +(0.5 * (lo + hi)).toFixed(4), coveragePct: +(cov * 100).toFixed(3), monahanPct: +(target * 100).toFixed(3) });
  }
  ocean.setSeaState({ windSpeed: param('wind', SEA.windSpeed) }, { immediate: true });
  return out;
}
async function onReady() {

    report.consistencyFar = consistencyCheck(ocean, U.uTime.value, 256, 5000, 3000, -2000);
    report.lagrangian = lagrangianCheck(ocean, U.uTime.value, 256, 400, c.x, c.z);

  }

  if (param('terms', false)) report.terms = termProbe(ocean, renderer, scene, camera, [[0.5, 0.97], [0.2, 0.97], [0.8, 0.97], [0.5, 0.75], [0.5, 0.55], [0.5, 0.43]]);
  if (param('perf', false)) report.perf = perf();
  if (param('perfterms', false)) report.perfTerms = perfBreakdown();

  if (param('calibsearch', 0)) report.whitecapSearch = whitecapSearch(param('calibsearch', 0) === 1 ? undefined : param('calibsearch', 0));   // =1, or =<cascade-0 offset>
  if (param('mirrorstats', false)) {
    const rt = ocean.reflection.target, W = rt.width, H = rt.height;
    const buf = new Uint16Array(W * H * 4);
    renderer.readRenderTargetPixels(rt, 0, 0, W, H, buf);
    let maxR = 0, at = null, nz = 0, maxA = 0;
    for (let i = 0; i < W * H; i++) { const r = THREE.DataUtils.fromHalfFloat(buf[i * 4]), a = THREE.DataUtils.fromHalfFloat(buf[i * 4 + 3]); if (r > maxR) { maxR = r; at = [i % W, Math.floor(i / W)]; } if (r > 0 || a > 0) nz++; maxA = Math.max(maxA, a); }
    report.mirror = { size: [W, H], maxR, at, nonZeroTexels: nz, maxA, pre: atmosphere.preExposure, logFar: ocean.reflection.logFar };
  }
  if (param('qswitch', false)) {
    const seq = [];
    for (const q of ['low', 'ultra', 'high']) { ocean.setQuality(QUALITY[q]); for (let i = 0; i < 20; i++) { step(1 / 60); post.render(1 / 60); } seq.push({ q, cascades: ocean.fft.active, rings: ocean._rings, reflection: ocean.reflection.enabled, h: +ocean.getHeight(10, 20).toFixed(3) }); }
    report.qualitySwitch = seq;
  }
  if (param('transition', false)) {
    const t0 = U.uTime.value, log = [];

    for (let i = 0; i <= 300; i++) { step(1 / 60); if (i % 60 === 0) log.push({ s: +(U.uTime.value - t0).toFixed(1), eased: +ocean.eased.windSpeed.toFixed(2), applied: +ocean.applied.windSpeed.toFixed(2), Hs: +ocean.R.windHs.toFixed(2), uWind: +U.uWindSpeed.value.toFixed(1) }); }

  report.sun = { elevation: +atmosphere.sunElevationDeg.toFixed(2), moonAz: +(atmosphere.moonAzimuthDeg ?? atmosphere.moon?.az ?? 0).toFixed(1), moonEl: +(atmosphere.moonElevationDeg ?? atmosphere.moon?.el ?? 0).toFixed(1) };

}
